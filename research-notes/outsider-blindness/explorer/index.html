}
function trajectory(searches) {
  const box = el('div', 'traj');
  if (!searches.length) { box.appendChild(el('div', 'meta', 'No web searches.')); return box; }
  searches.forEach((s, k) => {
    const w = el('div', 'srch'); w.appendChild(el('code', null, s.q));
    const act = { clean: '', withheld: 'some results withheld by the filter', refused_name: 'refused: the query named the guest' }[s.a];
    if (act) w.appendChild(el('span', 'act', act));
    if (s.r.length) {
      const chips = el('div', 'chips'), seen = new Set();
      s.r.forEach(r => { const dm = r.d.replace(/^www\./, ''); if (dm && !seen.has(dm)) { seen.add(dm); chips.appendChild(el('span', r.b ? 'b' : '', dm)); } });
      w.appendChild(chips);
      const det = el('details'); det.appendChild(el('summary', null, 'Show ' + s.r.length + ' results' + (s.r.some(r => r.b) ? ' (' + s.r.filter(r => r.b).length + ' blocked)' : '')));
      const res = el('div', 'res');
      s.r.forEach(r => { const d = el('div'); const t = el('div', r.b ? 't blk' : 't', r.t || r.u); d.appendChild(t);
        d.appendChild(el('div', 'd', (r.b ? 'blocked · ' : '') + r.d)); if (r.s && !r.b) d.appendChild(el('div', 's', r.s)); res.appendChild(d); });
      det.appendChild(res); w.appendChild(det);
    }
    box.appendChild(w);
  });
  return box;
}

function renderModel(box, Q, m) {
  box.textContent = '';
  let mode = 'web';
  const seg = el('div', 'seg');
  const views = [['web', 'With search']].concat(m.noweb ? [['noweb', 'Rerun without search']] : []);
  if (views.length > 1) views.forEach(([k, l]) => { const b = el('button', null, l); b.type = 'button'; b.setAttribute('aria-pressed', k === mode); b.addEventListener('click', () => { mode = k; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }); seg.appendChild(b); });
  box.appendChild(seg);
  const body = el('div'); box.appendChild(body);
  function draw() {
    body.textContent = '';
    const a = mode === 'web' ? m : m.noweb, g = a.grade;
    body.appendChild(highlighted(a.answer, g.spans, Q.points, g.points));
    body.appendChild(el('div', 'meta', m.model + ' · ' + a.words + ' words' + (mode === 'web' && m.seconds ? ' · ' + Math.round(m.seconds) + ' s' : '') + ' · ' + g.points.filter(p => p.ok).length + ' of ' + Q.points.length + ' points'));
    body.appendChild(el('div', 'lbl', 'Grader verdicts (GPT-6.2-Sol)'));
    body.appendChild(verdictList(Q.points, g));
    if (mode === 'web') { body.appendChild(el('div', 'lbl', 'Search trajectory · ' + m.searches.length + (m.searches.length === 1 ? ' search' : ' searches'))); body.appendChild(trajectory(m.searches)); }
  }
  draw();
}
function renderSamples(box, Q, S) {
  box.textContent = '';
  const keys = Object.keys(S); let sk = keys[0], si = 0;
  const seg = el('div', 'seg'); keys.forEach(k => { const b = el('button', null, S[k].label); b.type = 'button'; b.setAttribute('aria-pressed', k === sk); b.addEventListener('click', () => { sk = k; si = 0; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }); seg.appendChild(b); });
  box.appendChild(seg); const body = el('div'); box.appendChild(body);
  function draw() {
    body.textContent = '';
    const arr = S[sk].answers, grid = el('div', 'k8');
    arr.forEach((a, i) => { const b = el('button'); b.type = 'button'; b.setAttribute('aria-pressed', i === si); b.appendChild(document.createTextNode('Answer ' + (i + 1)));
      const ds = el('div', 'dots'); a.grade.points.forEach((p, j) => { const d = el('i'); if (p.ok) d.style.background = PC[j]; ds.appendChild(d); }); b.appendChild(ds);
      b.addEventListener('click', () => { si = i; draw(); }); grid.appendChild(b); });
    body.appendChild(grid);
    const counts = Q.points.map((p, j) => arr.filter(a => a.grade.points[j].ok).length);
    body.appendChild(el('div', 'meta', 'Answers that made each point: ' + counts.map((c, j) => 'point ' + (j + 1) + ' in ' + c + ' of 8').join(', ') + '. Graded by ' + S[sk].grader + '.'));
    const a = arr[si]; const h = highlighted(a.answer, a.grade.spans, Q.points, a.grade.points); h.style.marginTop = '12px'; body.appendChild(h);
    body.appendChild(verdictList(Q.points, a.grade));
  }
  draw();
}

function renderQuestion(id, modelIdx) {
  current = id; list.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
  main.textContent = ''; main.appendChild(el('div', 'empty', 'Loading…'));
  fetch('data/q/' + id + '.json').then(r => r.json()).then(Q => {
    if (current !== id) return;
    main.textContent = '';
    const h = el('div', 'head'); h.appendChild(avatar(slugOf(id), Q.speaker, true));
    const t = el('div'); t.appendChild(el('div', 'nm', Q.speaker + ' · ' + Q.domain));
    const src = el('div', 'src'); const a = el('a', null, Q.title); a.href = 'https://www.youtube.com/watch?v=' + Q.video + '&t=' + Q.t0 + 's'; a.target = '_blank'; a.rel = 'noopener';
    src.append(a, document.createTextNode(' · ' + Q.channel)); t.appendChild(src); h.appendChild(t); main.appendChild(h);
    main.appendChild(el('h2', 'q', Q.question));
    main.appendChild(el('div', 'lbl', 'What ' + Q.speaker + ' said (reference answer)'));
    main.appendChild(el('div', 'ref', Q.guest));
    playButton(main, Q.video, Q.t0, Q.t1, Q.speaker);
    main.appendChild(el('div', 'lbl', 'The points'));
    const lg = el('div', 'meta'); lg.style.margin = '-4px 0 8px'; lg.appendChild(document.createTextNode('Dots from left: '));
    MODELS.forEach((m, j) => { const i = el('i'); i.style.cssText = 'display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 ' + (j ? 10 : 2) + 'px;background:' + COLOR[m.lab]; lg.append(i, document.createTextNode(m.label)); });
    lg.appendChild(document.createTextNode('. Filled means the model made the point.')); main.appendChild(lg);
    Q.points.forEach((p, i) => {
      const r = el('div', 'pt'); r.style.setProperty('--pc', PC[i]); r.appendChild(el('span', 'nb', String(i + 1)));
      const c = el('div', null, p.core); const det = el('details'); det.appendChild(el('summary', null, 'Grader note')); det.appendChild(el('div', 'note', p.note)); c.appendChild(det); r.appendChild(c);
      const d6 = el('div', 'd6'); Q.models.forEach(m => { const b = el('b', m.grade.points[i].ok ? 'y' : ''); b.style.setProperty('--c', COLOR[m.lab]); b.title = m.label + (m.grade.points[i].ok ? ': made it' : ': missed it'); d6.appendChild(b); });
      r.appendChild(d6); main.appendChild(r);
    });
    main.appendChild(el('div', 'lbl', 'Model answers · highlights are the quotes the grader cited for each point'));
    const tabs = el('div', 'tabs'), mbox = el('div'); main.append(tabs, mbox);
    Q.models.forEach((m, j) => {
      const b = el('button'); b.type = 'button'; const i = el('i'); i.style.background = COLOR[m.lab];
      b.append(i, document.createTextNode(m.label), el('small', null, m.grade.points.filter(p => p.ok).length + '/' + Q.points.length));
      b.setAttribute('aria-selected', j === (modelIdx || 0));
      b.addEventListener('click', () => { tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b)); renderModel(mbox, Q, m); history.replaceState(null, '', '#' + id + '/' + j); });
      tabs.appendChild(b);
    });
    renderModel(mbox, Q, Q.models[modelIdx || 0]);
    if (Q.samples && Object.keys(Q.samples).length) {
      const det = el('details', 'box'); det.appendChild(el('summary', null, 'Eight sampled answers (sampling test)'));
      const sb = el('div'); det.appendChild(sb); main.appendChild(det); det.addEventListener('toggle', () => { if (det.open && !sb.firstChild) renderSamples(sb, Q, Q.samples); });
    }
    const pd = el('details', 'box'); pd.id = 'prompts'; pd.appendChild(el('summary', null, 'Prompts used for answering and grading'));
    pd.appendChild(el('div', 'lbl', 'Answer prompt (with search)')); pd.appendChild(el('pre', 'prompt', PROMPTS.ANSWER_PROMPT.replace('{question}', Q.question)));
    pd.appendChild(el('div', 'lbl', 'Answer prompt (without search)')); pd.appendChild(el('pre', 'prompt', PROMPTS.NO_WEB_PROMPT.replace('{question}', Q.question)));
    pd.appendChild(el('div', 'lbl', 'Grader prompt (template)')); pd.appendChild(el('pre', 'prompt', PROMPTS.GRADER_PROMPT));
    main.appendChild(pd);
    window.scrollTo({ top: Math.min(window.scrollY, root.offsetTop), behavior: 'smooth' });
  }).catch(() => { main.textContent = ''; main.appendChild(el('div', 'empty', 'Could not load this question.')); });
}

function filter() {
  const s = F.s.value.trim().toLowerCase(), d = F.d.value, p = F.p.value, o = F.o.value;
  rows = IDX.filter(q => (!d || q.d === d) && (!p || slugOf(q.id) === p)
    && (!o || (o === 'zero' ? q.p.every(b => b === '000000') : o === 'all' ? q.p.every(b => b === '111111') : o === 'searched' ? q.w.some(x => x > 0) : q.k8))
    && (!s || (q.q + ' ' + q.s + ' ' + q.d).toLowerCase().includes(s)));
  drawList();
}
function drawList() {
  list.textContent = ''; root.querySelector('.count').textContent = rows.length + (rows.length === 1 ? ' question' : ' questions');
  const frag = document.createDocumentFragment();
  rows.forEach(q => {
    const b = el('button', 'item'); b.type = 'button'; b.dataset.id = q.id; b.setAttribute('aria-current', q.id === current);
    b.appendChild(avatar(slugOf(q.id), q.s));
    const t = el('div'); t.appendChild(el('div', 'who', q.s + ' · ' + q.d)); t.appendChild(el('div', 'qq', q.q)); b.appendChild(t);
    const mini = el('div', 'mini'); MODELS.forEach((m, j) => { const sc = q.p.reduce((a, bits) => a + (bits[j] === '1' ? 1 : 0), 0) / q.p.length; const i = el('i', sc === 0 ? 'z' : ''); i.style.setProperty('--c', COLOR[m.lab]); i.style.height = Math.max(2, sc * 22) + 'px'; mini.appendChild(i); });
    b.appendChild(mini);
    b.addEventListener('click', () => { history.replaceState(null, '', '#' + q.id); renderQuestion(q.id); if (innerWidth < 860) main.scrollIntoView({ behavior: 'smooth' }); });
    frag.appendChild(b);
  });
  list.appendChild(frag);
}
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('p=')) { F.s.value = ''; F.d.value = ''; F.o.value = ''; F.p.value = h.slice(2); filter(); if (rows[0]) renderQuestion(rows[0].id); return; }
  const [id, mi] = h.split('/');
  if (id && IDX.some(q => q.id === id)) { renderQuestion(id, mi ? +mi : 0); const it = list.querySelector('[data-id="' + id + '"]'); if (it) it.scrollIntoView({ block: 'nearest' }); return; }
  if (rows[0]) renderQuestion(rows[0].id);
}
fetch('data/index.json').then(r => r.json()).then(j => {
  IDX = j.questions; MODELS = j.models; PROMPTS = j.prompts;
  Array.from(new Set(IDX.map(q => q.d))).sort().forEach(d => { const o = el('option', null, d); o.value = d; F.d.appendChild(o); });
  const ppl = {}; IDX.forEach(q => (ppl[slugOf(q.id)] = q.s));
  Object.entries(ppl).sort((a, b) => a[1].localeCompare(b[1])).forEach(([sl, n]) => { const o = el('option', null, n); o.value = sl; F.p.appendChild(o); });
  [F.d, F.p, F.o].forEach(x => x.addEventListener('change', filter)); F.s.addEventListener('input', filter);
  filter(); fromHash();
  window.addEventListener('hashchange', fromHash);
  document.getElementById('prompts-link').addEventListener('click', ev => { ev.preventDefault(); const pd = document.getElementById('prompts'); if (pd) { pd.open = true; pd.scrollIntoView({ behavior: 'smooth' }); } });
});
})();

  <!-- Scrolling Progress Bar -->
  <script type="text/javascript">
    /*
     * This JavaScript code has been adapted from the article
     * https://css-tricks.com/reading-position-indicator/ authored by Pankaj Parashar,
     * published on the website https://css-tricks.com on the 7th of May, 2014.
     * Couple of changes were made to the original code to make it compatible
     * with the `al-foio` theme.
     */
    const progressBar = $('#progress');
    /*
     * We set up the bar after all elements are done loading.
     * In some cases, if the images in the page are larger than the intended
     * size they'll have on the page, they'll be resized via CSS to accomodate
     * the desired size. This mistake, however, breaks the computations as the
     * scroll size is computed as soon as the elements finish loading.
     * To account for this, a minimal delay was introduced before computing the
     * values.
     */
    window.onload = function () {
      setTimeout(progressBarSetup, 50);
    };
    /*
     * We set up the bar according to the browser.
     * If the browser supports the progress element we use that.
     * Otherwise, we resize the bar thru CSS styling
     */
    function progressBarSetup() {
      if ('max' in document.createElement('progress')) {
        initializeProgressElement();
        $(document).on('scroll', function () {
          progressBar.attr({ value: getCurrentScrollPosition() });
        });
        $(window).on('resize', initializeProgressElement);
      } else {
        resizeProgressBar();
        $(document).on('scroll', resizeProgressBar);
        $(window).on('resize', resizeProgressBar);
      }
    }
    /*
     * The vertical scroll position is the same as the number of pixels that
     * are hidden from view above the scrollable area. Thus, a value > 0 is
     * how much the user has scrolled from the top
     */
    function getCurrentScrollPosition() {
      return $(window).scrollTop();
    }

    function initializeProgressElement() {
      let navbarHeight = $('#navbar').outerHeight(true);
      $('body').css({ 'padding-top': navbarHeight });
      $('progress-container').css({ 'padding-top': navbarHeight });
      progressBar.css({ top: navbarHeight });
      progressBar.attr({
        max: getDistanceToScroll(),
        value: getCurrentScrollPosition(),
      });
    }
    /*
     * The offset between the html document height and the browser viewport
     * height will be greater than zero if vertical scroll is possible.
     * This is the distance the user can scroll
     */
    function getDistanceToScroll() {
      return $(document).height() - $(window).height();
    }

    function resizeProgressBar() {
      progressBar.css({ width: getWidthPercentage() + '%' });
    }
    // The scroll ratio equals the percentage to resize the bar
    function getWidthPercentage() {
      return (getCurrentScrollPosition() / getDistanceToScroll()) * 100;
    }
  </script>
